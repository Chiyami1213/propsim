[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "propsim"
version = "1.0.0"
description = "Interactive 3D rocket propulsion simulator (liquid, hybrid, solid, electric)"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "pydantic>=2.5",
    "h5py>=3.10",
    "PySide6>=6.6",
    "pyqtgraph>=0.13",
    "pyvista>=0.43",
    "pyvistaqt>=0.11",
    "CoolProp>=8.0",                     # N2O saturation tables, regenerative-cooling coolant properties
    "scikit-image>=0.26",                # marching-cubes burning surface of the 3D solid-grain level set
]

[project.optional-dependencies]
rao = ["pygasflow>=1.4"]               # Rao bell angles from the Huzel & Huang chart (GPL-3.0, not bundled)
cea = ["rocketcea>=1.2"]              # direct NASA-CEA (GPL-3.0, not bundled); without it the shipped CEA tables are used
props = ["rocketprops>=0.1.10"]       # storable-propellant properties (GPL-3.0, not bundled); see propsim/data/library
fast = ["numba>=0.68"]                 # compiled level-set kernel; without it a NumPy fallback is used
dev = ["pytest>=8", "pytest-qt>=4.4", "ruff", "black", "rocketcea>=1.2", "jsonschema>=4.20"]

[project.scripts]
propsim = "propsim.app:main"

[tool.setuptools.packages.find]
include = ["propsim*"]

[tool.setuptools.package-data]
propsim = ["assets/*", "core/thermo/data/*.npz", "data/library/*.csv", "data/library/*.md", "data/library/schemas/*.json",
           "data/library/fluids/*.csv", "data/library/fluids/tables/*.csv", "data/library/fluids/sat/*.csv",
           "data/library/components/*.json", "data/library/components/tables/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110

[tool.black]
line-length = 110
